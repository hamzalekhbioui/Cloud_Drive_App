name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  backend-deploy:
    name: Deploy Backend (Azure Container Apps)
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      IMAGE_NAME: clouddrive-api
    steps:
      - name: Check deploy configuration
        id: precheck
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ] || [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping backend deployment because AZURE_CREDENTIALS or ACR_LOGIN_SERVER is not configured."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.precheck.outputs.should_deploy == 'true'
        uses: actions/checkout@v4

      - name: Azure Login
        if: steps.precheck.outputs.should_deploy == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image to ACR
        if: steps.precheck.outputs.should_deploy == 'true'
        run: |
          az acr build \
            --registry "${{ secrets.ACR_LOGIN_SERVER }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            --file Dockerfile \
            .

      - name: Deploy to Azure Container Apps
        if: steps.precheck.outputs.should_deploy == 'true'
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ca-clouddrive-api
          resourceGroup: rg-clouddrive-prod
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          targetPort: 8080
